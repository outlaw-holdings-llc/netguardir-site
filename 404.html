<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>404 — Page not found · InfoRelay NetGuard</title>
<style>
  :root{--bg:#0b0f14;--panel:#111823;--ink:#e6edf3;--muted:#8b98a5;--accent:#38bdf8;--line:#1e2937}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;padding:1.5rem}
  .card{max-width:560px;text-align:center}
  .code{font-size:4.5rem;font-weight:700;letter-spacing:-.03em;margin:0;color:var(--accent)}
  h1{font-size:1.35rem;margin:.4rem 0 .6rem}
  p{color:var(--muted);margin:0 auto 1.6rem;max-width:44ch}
  .links{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
  a.btn{display:inline-block;padding:.6rem 1.1rem;border:1px solid var(--line);border-radius:10px;
    background:var(--panel);color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem}
  a.btn:hover{border-color:var(--accent);color:var(--accent)}
  a.home{background:var(--accent);color:#04121c;border-color:var(--accent)}
</style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <h1>That page isn't here.</h1>
    <p>The link may be old or mistyped. Head back to the NetGuard family or jump to a product.</p>
    <div class="links">
      <a class="btn home" href="/">Home</a>
      <a class="btn" href="/certguard/">CertGuard</a>
      <a class="btn" href="/assetguard/">AssetGuard</a>
      <a class="btn" href="/scoreguard/">ScoreGuard</a>
      <a class="btn" href="/docs/user-guide">Docs</a>
    </div>
  </div>
</body>
</html>
